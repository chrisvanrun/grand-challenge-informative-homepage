<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose A or B</title>
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #ffffff 0%, #f4f7fb 55%, #e7eef8 100%);
    }

    .choice-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 24px 0;
    }

    .choice-card {
      border: 1px solid rgba(16, 35, 60, 0.12);
      border-radius: 1.25rem;
      box-shadow: 0 18px 50px rgba(16, 35, 60, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }

    .choice-card:hover,
    .choice-card:focus-within {
      transform: translateY(-3px);
      box-shadow: 0 24px 60px rgba(16, 35, 60, 0.16);
      border-color: rgba(16, 35, 60, 0.2);
    }

    .choice-eyebrow {
      letter-spacing: 0.12em;
    }

    .choice-link {
      color: inherit;
      text-decoration: none;
    }

    .choice-link:hover,
    .choice-link:focus {
      color: inherit;
      text-decoration: none;
    }

    .choice-card-a {
      background-color: #0b6270;
      border-color: #0b6270;
    }

    .choice-card-a:hover,
    .choice-card-a:focus-within {
      background-color: #095260;
      border-color: #095260;
    }

    .choice-card-b {
      background-color: #1f4b99;
      border-color: #1f4b99;
    }

    .choice-card-b:hover,
    .choice-card-b:focus-within {
      background-color: #173a78;
      border-color: #173a78;
    }

    .choice-card h2 {
      font-size: 3rem;
      line-height: 1;
    }

    .choice-card .small-label {
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <main class="choice-shell">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
          <div class="card choice-card text-center">
            <div class="card-body p-4 p-md-5">
              <p class="text-uppercase text-muted small font-weight-bold choice-eyebrow mb-2">Grand Challenge</p>
              <h1 class="display-4 font-weight-bold mb-3">Choose a page</h1>
              <p class="lead text-muted mb-4">
                Select witch version of the homepage to view.
              </p>
              <div class="row">
                <div class="col-md-6 mb-4 mb-md-0 pr-md-2">
                  <div class="card choice-card choice-card-a text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-between text-left p-4 p-lg-5 position-relative">
                      <div>
                        <h2>Page A</h2>
                      </div>
                      <a class="choice-link stretched-link" href="A.html" aria-label="Open A page"></a>
                    </div>
                  </div>
                </div>
                <div class="col-md-6 pl-md-2">
                  <div class="card choice-card choice-card-b text-white h-100">
                    <div class="card-body d-flex flex-column justify-content-between text-left p-4 p-lg-5 position-relative">
                      <div>
                        <h2>Page B</h2>
                      </div>
                      <a class="choice-link stretched-link" href="B.html" aria-label="Open B page"></a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
